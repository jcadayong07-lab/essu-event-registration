<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>University Event System – ESSU</title>
<style>
:root{--dg:#0c4526;--dg2:#15612f;--dg3:#0a3a20;--gold:#c9a227;--gold2:#e6c75a;--cream:#fbf8e6;--cream2:#f3eed0;--ink:#173323;--mute:#5f6e62;--line:#dcd6b0;--red:#b3261e;--red1:#fadcd8;--grn1:#d3efd3;--yel1:#fbe9a8}
*{box-sizing:border-box}
body{margin:0;font-family:"Segoe UI",system-ui,sans-serif;color:var(--ink);font-size:14px;background:#e9e6d2}
button,input,select{font:inherit}
:focus-visible{outline:3px solid var(--gold2);outline-offset:2px}
svg.i{width:1.15em;height:1.15em;vertical-align:-.2em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.hide{display:none!important}
/* login */
.lg{min-height:100vh;background:linear-gradient(135deg,#e3c548 0%,#a9a83a 45%,#5d9030 100%);display:flex;flex-direction:column}
.lgbar{background:#fff;padding:12px 28px;display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:1.05rem}
.lgbar img{height:44px}
.lgmid{flex:1;display:flex;align-items:center;justify-content:center;padding:28px 14px}
.lcard{background:#fff;border-radius:14px;padding:26px 24px;width:100%;max-width:390px;box-shadow:0 10px 30px rgba(0,0,0,.2)}
.lcard .seal{display:block;width:92px;height:92px;margin:0 auto 6px}
.lcard h1{margin:0;text-align:center;font-size:1.45rem;color:#0f2a56}
.lcard .sub{text-align:center;color:var(--mute);font-size:.86rem;margin:4px 0 16px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:#a9a83a;border-radius:8px;padding:3px;margin-bottom:14px}
.seg button{border:0;background:none;padding:8px;border-radius:6px;cursor:pointer;color:#33407a;font-weight:600}
.seg button.on{background:var(--dg2);color:#fff}
label{display:block;font-size:.72rem;font-weight:800;letter-spacing:.02em;margin:12px 0 5px;text-transform:uppercase}
input,select{width:100%;padding:9px 11px;border:1px solid #cfd3c8;border-radius:7px;background:#fff;color:var(--ink)}
.lrow{display:flex;justify-content:space-between;align-items:center;margin:12px 0;font-size:.82rem}
.lrow label{display:flex;gap:6px;align-items:center;text-transform:none;font-weight:400;margin:0;letter-spacing:0}
.lrow input{width:auto}
a.lnk{color:#b58a00;cursor:pointer;text-decoration:none}
.btn{border:0;border-radius:7px;padding:10px 16px;cursor:pointer;font-weight:700;background:var(--dg2);color:#fff;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:hover{filter:brightness(1.12)}
.btn.w{width:100%}
.btn.gold{background:linear-gradient(#e0bd45,#b98f12);color:#fff;text-shadow:0 1px 1px rgba(0,0,0,.25)}
.btn.out{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn.sm{padding:6px 12px;font-size:.8rem}
.err{background:var(--red1);color:var(--red);padding:8px 10px;border-radius:7px;font-size:.84rem;margin-top:10px}
.su{text-align:center;font-size:.82rem;margin-top:14px}
/* shell */
.top{background:linear-gradient(#0f5a2e,#0a3d20);border-bottom:3px solid var(--gold);color:#fff;display:flex;align-items:center;gap:12px;padding:8px 18px;position:sticky;top:0;z-index:5}
.top img.s{width:44px;height:44px;filter:drop-shadow(0 0 3px rgba(230,199,90,.55))}
.top b{font-size:1.05rem;white-space:nowrap}
.top .bt{background:none;border:0;color:var(--gold2);cursor:pointer;font-size:1.3rem;padding:2px 8px;border-left:1px solid rgba(255,255,255,.3)}
.top .sp{flex:1}
.who{display:flex;gap:8px;align-items:center;background:rgba(0,0,0,.18);padding:5px 12px;border-radius:99px}
.who svg{color:var(--gold2);width:1.5em;height:1.5em}
.sh{display:grid;grid-template-columns:210px 1fr;min-height:calc(100vh - 56px);background:var(--dg)}
.sb{background:linear-gradient(170deg,#0f5a2e,#073018);padding:16px 12px;display:flex;flex-direction:column;position:relative;overflow:hidden}
.sb::after{content:"";position:absolute;left:-30px;right:-30px;bottom:50px;height:110px;border-top:3px solid var(--gold);border-radius:60% 40% 0 0/100% 100% 0 0;opacity:.7;pointer-events:none}
.sb a{color:#e6efe6;padding:10px 12px;border-radius:7px;cursor:pointer;display:flex;gap:10px;align-items:center;margin-bottom:4px}
.sb a:hover{background:rgba(255,255,255,.08)}
.sb a.on{background:linear-gradient(#e6c75a,#c9a227);color:#2a2000;font-weight:700;box-shadow:0 0 0 1px #f3dc83 inset}
.sb .sp{flex:1}
.sb a.lo{position:relative;z-index:1;margin-bottom:8px}
.ct{background:var(--dg);padding:14px}
.pg{background:linear-gradient(180deg,#fffdf0,var(--cream));border:2px solid var(--gold);border-radius:12px;padding:20px;min-height:100%}
.ph{display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.ph .bd{width:46px;height:46px;border-radius:50%;background:var(--dg);color:var(--gold2);display:flex;align-items:center;justify-content:center;border:2px solid var(--gold);font-size:1.3rem}
.ph h2{margin:0;font-size:1.5rem;font-family:Georgia,serif;color:var(--dg)}
.ph p{margin:0;color:var(--mute);font-size:.86rem}
.ph .sp{flex:1}
.wl{border-radius:10px;padding:14px 18px;margin-bottom:14px;background:linear-gradient(90deg,#fffbe6 40%,#d8e8c6);display:flex;justify-content:space-between;align-items:center;overflow:hidden;gap:10px}
.wl h2{margin:0;font-size:1.35rem;color:#10321f}.wl p{margin:2px 0 0;font-size:.84rem;color:var(--mute)}
.wl svg{height:64px;width:auto;flex:none}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:14px}
.tile{border-radius:9px;padding:12px 14px;color:#fff;background:linear-gradient(135deg,#1b6f37,#0d4a26);border:1px solid #d8bb55;display:flex;align-items:center;gap:12px}
.tile.g2{background:linear-gradient(135deg,#e2bd42,#b88c10)}
.tile .ic{font-size:1.7rem}
.tile b{display:block;font-size:1.7rem;line-height:1}
.tile span{font-size:.76rem}
.tile.lt{background:var(--cream2);color:var(--ink);border-color:var(--line)}
.tile.lt .ic{color:#b58a00}
.two{display:grid;grid-template-columns:1fr 250px;gap:14px}
.box{background:#fff;border:1px solid var(--line);border-radius:9px;padding:14px;margin-bottom:12px}
.box h3{margin:0 0 10px;font-size:1rem;display:flex;justify-content:space-between;align-items:center;gap:8px}
.box h3 a{font-size:.78rem;font-weight:400;color:var(--mute);cursor:pointer}
.qa{display:flex;flex-direction:column;gap:8px}
.qa button{background:#fff;border:1px solid var(--line);border-radius:7px;padding:9px 10px;text-align:left;cursor:pointer;display:flex;gap:8px;align-items:center;color:var(--ink)}
.qa button:first-of-type{background:var(--dg2);color:#fff}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.84rem}
th{background:var(--dg);color:#fff;padding:9px 8px;text-align:left;white-space:nowrap}
.box th,.lightth th{background:none;color:var(--ink);border-bottom:2px solid var(--line)}
td{padding:9px 8px;border-bottom:1px solid #eee8c8;vertical-align:middle}
td.ac{white-space:nowrap}
.ib{border:0;border-radius:5px;width:30px;height:28px;cursor:pointer;color:#fff;background:var(--dg2);margin-right:4px}
.ib.t{background:#d9b13c}.ib.r{background:#b3261e}
.st{display:inline-block;border-radius:99px;padding:2px 11px;font-size:.74rem;font-weight:700}
.Active,.Registered{background:var(--grn1);color:#1a6a2a}.Pending{background:var(--yel1);color:#8a6200}
.Inactive,.Cancelled{background:var(--red1);color:var(--red)}
.tb{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;align-items:center}
.tb .sr{flex:1;min-width:180px;position:relative}
.tb .sr svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--mute)}
.tb .sr input{padding-left:32px}
.tb select{width:auto;min-width:130px}
.pag{display:flex;gap:6px;justify-content:flex-end;margin-top:12px}
.pag button{border:1px solid var(--line);background:#fff;border-radius:5px;width:30px;height:28px;cursor:pointer}
.pag button.on{background:var(--dg);color:#fff}
.empty{text-align:center;color:var(--mute);padding:22px}
.fm{max-width:640px;background:#fff;border:1px solid var(--line);border-radius:9px;padding:6px 18px 18px}
.fg{display:grid;grid-template-columns:repeat(3,1fr);gap:0 14px}.fg .a{grid-column:1/-1}.fg .b{grid-column:span 2}
.fa{display:flex;gap:10px;margin-top:18px}.fa .btn{flex:1}
.eg{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.ec{background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px;box-shadow:0 2px 6px rgba(0,0,0,.06)}
.ban{height:105px;border-radius:7px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:2.6rem;margin-bottom:8px}
.ban.pic{height:180px;background:var(--cream2);overflow:hidden}.ban.pic img{width:100%;height:100%;object-fit:cover;display:block}
.rc .ban.pic{height:auto;max-height:440px}.rc .ban.pic img{height:auto;max-height:440px;object-fit:contain}
.th{width:34px;height:34px;object-fit:cover;border-radius:4px;vertical-align:middle;margin-right:8px;border:1px solid var(--line)}
.pp{margin-top:8px}.pp img{max-width:240px;max-height:200px;border-radius:8px;border:1px solid var(--line);display:block;margin-bottom:6px}
.ec h3,.rc h3{margin:4px 0 8px;font-size:1rem}
.ec p{margin:4px 0;display:flex;gap:8px;align-items:center;font-size:.85rem}.ec p svg{color:#a57d00}
.pill{display:inline-flex;gap:6px;align-items:center;background:var(--yel1);border-radius:99px;padding:3px 12px;font-size:.78rem;margin:6px 0 8px}
.rg{display:grid;grid-template-columns:260px 1fr;gap:16px}
.rc{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px}
.ok{max-width:560px;margin:0 auto;text-align:center;background:#fff;border:1px solid var(--line);border-radius:12px;padding:22px}
.ok .ck{width:62px;height:62px;border-radius:50%;background:var(--dg2);color:#fff;font-size:1.9rem;display:flex;align-items:center;justify-content:center;margin:0 auto 10px;box-shadow:0 0 0 4px var(--gold2)}
.ok h2{margin:6px 0;color:var(--dg)}
.dl{background:var(--cream);border-radius:8px;padding:10px 14px;text-align:left;margin:14px 0;display:grid;grid-template-columns:28px 120px 1fr;gap:10px 4px;align-items:center}
.dl svg{color:var(--dg)}
.tabs{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.tabs button{flex:1;min-width:70px;border:1px solid var(--line);background:var(--cream);border-radius:5px;padding:6px;cursor:pointer}
.tabs button.on{background:#d9b13c;color:#fff;font-weight:700;border-color:#d9b13c}
.pf{display:flex;gap:14px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px}
.av{width:62px;height:62px;border-radius:50%;background:var(--dg);color:var(--gold2);border:3px solid var(--gold);display:flex;align-items:center;justify-content:center;font-size:1.9rem}
.pf h3{margin:0;font-size:1.2rem}.pf span{color:var(--mute)}
.chart{display:flex;gap:6px;align-items:flex-end;height:230px;border-left:1px solid var(--line);border-bottom:1px solid var(--line);padding:0 10px;background:repeating-linear-gradient(transparent 0 45px,#eee8c8 45px 46px)}
.chart div{flex:1;text-align:center;display:flex;flex-direction:column;justify-content:flex-end;height:100%;font-size:.78rem}
.chart i{display:block;background:linear-gradient(#2c8a43,#0f5a2e);border-radius:3px 3px 0 0;margin:2px auto 0;width:70%}
.xl{display:flex;gap:6px;padding:4px 10px 0;font-size:.7rem;text-align:center;color:var(--mute)}.xl span{flex:1}
.mk{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;padding:14px;z-index:20}
.md{background:#fff;border-radius:10px;padding:20px;max-width:480px;width:100%;max-height:92vh;overflow:auto}
.md h3{margin:0 0 4px;color:var(--dg)}
.toast{position:fixed;bottom:18px;right:18px;background:var(--dg);color:#fff;padding:11px 16px;border-radius:8px;border-left:5px solid var(--gold);z-index:30}
.mail{border:1px dashed #b58a00;background:var(--cream);border-radius:8px;padding:10px 12px;font-size:.8rem;margin:10px 0}
.mail small{display:block;color:#8a6200;font-weight:700;margin-bottom:6px}
.mail b.code{display:block;font-size:1.6rem;letter-spacing:.3em;color:var(--dg);margin:6px 0}
.hp{color:var(--mute);font-size:.84rem;margin:4px 0 0}
.mt{display:none}
@media(max-width:820px){
.sh{grid-template-columns:1fr}.sb{display:none;padding-bottom:20px}.sb.open{display:flex}.sb::after{display:none}
.two,.rg{grid-template-columns:1fr}.fg{grid-template-columns:1fr}.fg .b{grid-column:auto}.who span{display:none}.ct{padding:8px}.pg{padding:14px}.wl svg{display:none}
.lgbar img{height:32px}.top b{font-size:.9rem}}
</style>
</head>

async function api(p,m,b){

  <div class="lgmid"><form class="lcard" onsubmit="doLogin(event)"><img class="seal" src="${SEAL}" alt="ESSU seal">

const setSt=(id,st)=>act(()=>api("/registrations/"+id,"PATCH",{status:st}),"Registration "+st.toLowerCase());
let PST=null,PRM=false;
function ban(e){return e.poster?`<div class="ban pic"><img src="${esc(e.poster)}" alt="Poster for ${esc(e.name)}"></div>`:`<div class="ban" style="background:${BAN[e.ic]||BAN.bar}">${I(e.ic||"bar")}</div>`}

function clearPoster(){PST=null;PRM=true;$("f8").value="";$("pp").innerHTML=""}
function pickPoster(inp){const f=inp.files[0];if(!f)return;
  if(!/^image\/(png|jpeg|webp)$/.test(f.type)){toast("Choose a PNG, JPG or WEBP image.");inp.value="";return}
  const rd=new FileReader();rd.onload=()=>{const im=new Image();im.onload=()=>{
    const k=Math.min(1,1000/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);
    const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);
    const d=c.toDataURL("image/jpeg",.85);
    if(d.length>2.5e6){toast("Image is too large. Choose a smaller one.");inp.value="";return}
    PST=d;PRM=false;$("pp").innerHTML=`<img src="${d}" alt="Poster preview"><button type="button" class="btn out" onclick="clearPoster()">Remove poster</button>`};
    im.onerror=()=>toast("That file could not be read as an image.");im.src=rd.result};rd.readAsDataURL(f)}
async function saveEv(e){e.preventDefault();
  const o={name:$("f1").value.trim(),date:$("f2").value,time:$("f3").value,end:$("f4").value,slots:+$("f5").value,venue:$("f6").value.trim(),status:$("f7").value};
  if(PST)o.poster=PST;else if(PRM)o.removePoster=true;
  if(o.end<=o.time){toast("End time must be after the start time.");return}
  try{await(sel?api("/events/"+sel,"PUT",o):api("/events","POST",o));await load();toast(sel?"Event updated":"Event added");sel=null;go("events")}catch(x){toast(x.message)}}
function delEv(id){if(confirm("Delete this event and its registrations?"))act(()=>api("/events/"+id,"DELETE"),"Event deleted")}
function regForm(id){const r=D.regs.find(x=>x.id==id);

  <label for="r4">Status</label><select id="r4">${["Registered","Pending","Cancelled"].map(s=>`<option ${r.status==s?"selected":""}>${s}</option>`).join("")}</select>
  <div class="fa"><button type="button" class="btn out" onclick="closeM()">Close</button><button class="btn">Save status</button></div></form>`)}
function saveReg(e,id){e.preventDefault();const st=$("r4").value;closeM();if(st!=D.regs.find(x=>x.id==id).status)setSt(id,st)}
function delReg(id){if(confirm("Delete this registration record?"))act(()=>api("/registrations/"+id,"DELETE"),"Record deleted")}
async function report(){
  const a=F.a||"2026-01-01",b=F.b||"2026-12-31",ids=D.events.filter(e=>(!F.ev||e.id==F.ev)&&e.date>=a&&e.date<=b).map(e=>e.id);
  const rows=[["Ref","Student ID","Name","Email","Contact","Event","Date","Status"],...D.regs.filter(r=>ids.includes(r.eid)).map(r=>["REG-"+String(r.id).slice(-6),r.sid,r.name,r.email,r.contact,E(r.eid).name,E(r.eid).date,r.status])];

    modal(`<h3>Check your Gmail</h3><p class="hp">If <b>${esc(id)}</b> has an account, we sent a password reset link to its Gmail address. Open the email, click the link, choose a new password, then log in here. Check your spam folder if it does not arrive.</p><div class="fa"><button class="btn" onclick="closeM()">Done</button></div>`)}
  catch(x){const b=$("fpe");b.textContent=x.message;b.classList.remove("hide")}}
async function resetPw(sid){
  if(!confirm("Send a password reset email to "+sid+"?"))return;
  try{const j=await api("/admin/reset-password/"+encodeURIComponent(sid),"POST");
    modal(`<h3>Reset email sent</h3><p class="hp">A password reset link was sent to <b>${esc(j.sent)}</b>. The student opens it and chooses a new password.</p><div class="fa"><button class="btn" onclick="closeM()">Done</button></div>`)}
  catch(x){toast(x.message)}}
function forceChange(){}
function addSamples(){if(confirm("Add 4 sample events (Tech Seminar, Sports Meet, Coding Workshop, Cultural Show)?"))act(()=>api("/seed-events","POST"),"Sample events added")}
function changePw(){
  modal(`<form onsubmit="doChange(event)"><h3>Change password</h3>
  <label for="cu">Current password</label><input id="cu" type="password" autocomplete="current-password" required>
  <label for="cn">New password</label><input id="cn" type="password" minlength="6" autocomplete="new-password" required>
  <label for="cc">Confirm new password</label><input id="cc" type="password" minlength="6" autocomplete="new-password" required>
  <div class="err hide" id="cne" role="alert"></div>
  <div class="fa"><button type="button" class="btn out" onclick="closeM()">Cancel</button><button class="btn">Save password</button></div></form>`)}
async function doChange(e){e.preventDefault();const b=$("cne"),bad=m=>{b.textContent=m;b.classList.remove("hide")};
  if($("cn").value!==$("cc").value)return bad("The two passwords do not match.");
  try{await api("/change-password","POST",{current:$("cu").value,password:$("cn").value});U.mustChange=false;closeM();toast("Password updated.")}
  catch(x){bad(x.message)}}
login();

<script>
/// Your web app's Firebase configuration
window.FIREBASE_CONFIG={
  apiKey: "AIzaSyAmvokKRQbEJS1VOZohP1QX3WO73mNJ2h8",
  authDomain: "event-reg-3882e.firebaseapp.com",
  projectId: "event-reg-3882e",
  storageBucket: "event-reg-3882e.firebasestorage.app",
  messagingSenderId: "909362227712",
  appId: "1:909362227712:web:22b21d57170747778686e5"
};
</script>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {getAuth,signInWithEmailAndPassword,createUserWithEmailAndPassword,sendPasswordResetEmail,signOut,reauthenticateWithCredential,EmailAuthProvider,updatePassword} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import {getFirestore,doc,getDoc,getDocs,updateDoc,deleteDoc,collection,query,where,runTransaction,writeBatch,Timestamp,serverTimestamp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

const C=window.FIREBASE_CONFIG||{};
const configured=!!C.apiKey&&!/PASTE/i.test(C.apiKey);
let auth,db;
if(configured){const app=initializeApp(C);auth=getAuth(app);db=getFirestore(app)}

const fail=m=>{throw new Error(m)};
const SID=/^\d{2}-\d{5}$/,GM=/^[A-Za-z0-9._%+-]+@gmail\.com$/i;
const key=s=>String(s||"").trim().toLowerCase();
let ME=null;            // signed-in user's profile {uid,id,name,role,email,contact,course,year}
const REGMAP={};        // registration number -> Firestore document id
const pub=p=>({id:p.id,name:p.name,role:p.role,email:p.email||"",contact:p.contact||"",course:p.course||"",year:p.year_level||p.year||"",mustChange:false});

function msg(e){
  const c=(e&&e.code)||"";
  if(["auth/invalid-credential","auth/wrong-password","auth/user-not-found","auth/invalid-email"].includes(c))return"Invalid ID or password";
  if(c=="auth/too-many-requests")return"Too many attempts. Please wait a few minutes and try again.";
  if(c=="auth/email-already-in-use")return"That Gmail address already has an account.";
  if(c=="auth/weak-password")return"Password must be at least 6 characters";
  if(c=="auth/network-request-failed"||c=="unavailable")return"Cannot reach Firebase. Check your internet connection.";
  if(c=="permission-denied")return"You do not have permission to do that.";
  return(e&&e.message)||"Something went wrong";
}
const need=()=>{if(!ME||!auth.currentUser)fail("Please log in")};
const needAdmin=()=>{need();if(ME.role!="Admin")fail("Administrators only")};

function lvalid(b){
  if(!(b&&b.name&&b.date&&b.time&&b.end&&b.venue&&Number.isInteger(+b.slots)&&+b.slots>=0))fail("Fill in all event fields correctly.");
  if(!["Active","Inactive"].includes(b.status))fail("Status must be Active or Inactive.");
}
// Posters are shrunk and kept inside the event document (Firebase Storage needs a paid plan)
function shrink(url){return new Promise((res,rej)=>{
  if(!/^data:image\/(png|jpeg|webp);base64,/.test(String(url||"")))return rej(new Error("Poster must be a PNG, JPG or WEBP image."));
  const img=new Image();img.onerror=()=>rej(new Error("The file is not a valid image."));
  img.onload=()=>{
    const k=Math.min(1,800/Math.max(img.width,img.height)),c=document.createElement("canvas");
    c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);
    const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height);x.drawImage(img,0,0,c.width,c.height);
    let o=c.toDataURL("image/jpeg",.72);if(o.length>700000)o=c.toDataURL("image/jpeg",.5);
    o.length>700000?rej(new Error("Poster is too large. Use a smaller image.")):res(o);
  };
  img.src=url;
})}

const endAtOf=(d,t)=>Timestamp.fromDate(new Date(d+"T"+t+":00"));
async function nextEventNum(){const sn=await getDocs(collection(db,"events"));return Math.max(0,...sn.docs.map(d=>+d.data().n||0))+1}

async function route(p,m,b){
  const s=p.split("/").filter(Boolean),id=s[0]=="admin"?s[2]:s[1];
  const k=m+" /"+(s[0]=="admin"?"admin/reset-password/:id":s[0]+(s[1]?"/:id":""));
  switch(k){
  case "POST /login":{
    if(!b.id||!b.password)fail("ID and password are required");
    const mp=await getDoc(doc(db,"idmap",key(b.id)));
    if(!mp.exists())fail("Invalid ID or password");
    const cred=await signInWithEmailAndPassword(auth,mp.data().email,b.password);
    const ac=await getDoc(doc(db,"accounts",cred.user.uid));
    if(!ac.exists()){await signOut(auth);fail("This account is not set up yet. Ask the administrator.")}
    ME={uid:cred.user.uid,...ac.data()};
    return{token:cred.user.uid,user:pub(ME)};
  }
  case "POST /signup":{
    if(!SID.test(b.id||""))fail("Student ID must look like 24-00341");
    if(!GM.test(b.email||""))fail("Use a Gmail address");
    if(!b.name||!b.contact||(b.password||"").length<6)fail("Fill in all fields (password: 6+ characters)");
    const em=b.email.trim().toLowerCase(),kk=key(b.id);
    if((await getDoc(doc(db,"idmap",kk))).exists())fail("That ID already has an account");
    const cred=await createUserWithEmailAndPassword(auth,em,b.password);
    try{
      const bt=writeBatch(db);
      bt.set(doc(db,"accounts",cred.user.uid),{id:b.id.trim(),name:b.name,role:"Student",email:em,contact:b.contact,course:"",year_level:""});
      bt.set(doc(db,"idmap",kk),{uid:cred.user.uid,email:em});
      await bt.commit();
    }catch(e){await cred.user.delete().catch(()=>{});throw e}
    await signOut(auth);return{ok:true};
  }
  case "POST /forgot-password":{
    // Same reply whether or not the ID exists, so IDs cannot be probed
    try{const mp=await getDoc(doc(db,"idmap",key(b.id)));if(mp.exists())await sendPasswordResetEmail(auth,mp.data().email)}catch(e){}
    return{ok:true};
  }
  case "POST /change-password":{
    need();if((b.password||"").length<6)fail("Password must be at least 6 characters");
    const u=auth.currentUser;
    try{await reauthenticateWithCredential(u,EmailAuthProvider.credential(u.email,b.current||""))}catch(e){fail("Current password is incorrect")}
    await updatePassword(u,b.password);return{ok:true};
  }
  case "POST /admin/reset-password/:id":{
    needAdmin();
    const mp=await getDoc(doc(db,"idmap",key(id)));
    if(!mp.exists())fail("Student account not found");
    await sendPasswordResetEmail(auth,mp.data().email);return{sent:mp.data().email};
  }
  case "PUT /profile":{
    need();
    if(key(b.email)!==key(ME.email))fail("Your Gmail is your login, so it can't be changed here. Ask the administrator.");
    const f={name:b.name,contact:b.contact,course:b.course||"",year_level:b.year||""};
    await updateDoc(doc(db,"accounts",ME.uid),f);Object.assign(ME,f);
    return{ok:true};
  }
  case "GET /events":{
    need();const sn=await getDocs(collection(db,"events"));
    return sn.docs.map(d=>d.data()).sort((x,y)=>(x.date+x.time)<(y.date+y.time)?-1:1).map(e=>({id:e.n,name:e.name,event_date:e.date,event_time:e.time,end_time:e.end,venue:e.venue,slots:e.slots,status:e.status,poster:e.poster||"",available_slots:e.slots-(e.taken||0)}));
  }
  case "POST /events":{
    needAdmin();lvalid(b);if(+b.slots<1)fail("Slots must be at least 1.");
    const po=b.poster?await shrink(b.poster):"",n=await nextEventNum();
    await runTransaction(db,async tx=>{
      const r=doc(db,"events",String(n));
      if((await tx.get(r)).exists())fail("Please try again.");
      tx.set(r,{n,name:b.name,date:b.date,time:b.time,end:b.end,venue:b.venue,slots:+b.slots,taken:0,status:b.status,poster:po,endAt:endAtOf(b.date,b.end)});
    });
    return{id:n};
  }
  case "PUT /events/:id":{
    needAdmin();lvalid(b);
    const r=doc(db,"events",String(id)),sn=await getDoc(r);if(!sn.exists())fail("Event not found");
    const e=sn.data();let po=e.poster||"";
    if(b.poster)po=await shrink(b.poster);else if(b.removePoster)po="";
    await updateDoc(r,{name:b.name,date:b.date,time:b.time,end:b.end,venue:b.venue,status:b.status,slots:+b.slots+(e.taken||0),poster:po,endAt:endAtOf(b.date,b.end)});
    return{ok:true};
  }
  case "DELETE /events/:id":{
    needAdmin();
    const rs=await getDocs(query(collection(db,"registrations"),where("eid","==",String(id))));
    await Promise.all(rs.docs.map(d=>deleteDoc(d.ref)));
    await deleteDoc(doc(db,"events",String(id)));return{ok:true};
  }
  case "POST /seed-events":{
    needAdmin();
    if(!(await getDocs(collection(db,"events"))).empty)fail("Events already exist. Delete them first, or add events yourself.");
    const day=n=>{const d=new Date();d.setDate(d.getDate()+n);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
    const L=[["Tech Seminar",14,"09:00","12:00","Auditorium",100],["Sports Meet",21,"08:00","17:00","Gymnasium",50],["Coding Workshop",28,"13:00","16:00","Lab 2",30],["Cultural Show",45,"18:00","21:00","Open Court",80]];
    const bt=writeBatch(db);
    L.forEach((e,i)=>{const d=day(e[1]);bt.set(doc(db,"events",String(i+1)),{n:i+1,name:e[0],date:d,time:e[2],end:e[3],venue:e[4],slots:e[5],taken:0,status:"Active",poster:"",endAt:endAtOf(d,e[3])})});
    await bt.commit();return{ok:true};
  }
  case "GET /registrations":{
    need();
    const q=ME.role=="Admin"?collection(db,"registrations"):query(collection(db,"registrations"),where("uid","==",ME.uid));
    const sn=await getDocs(q);
    return sn.docs.map(d=>{const r=d.data(),c=r.createdAt,t=c&&c.seconds!==undefined?c.seconds*1e6+Math.floor((c.nanoseconds||0)/1000):0;REGMAP[t]=d.id;return{id:t,sid:r.sid,name:r.name,email:r.email,contact:r.contact,eid:+r.eid,status:r.status}}).sort((x,y)=>x.id-y.id);
  }
  case "POST /registrations":{
    need();if(ME.role!="Student")fail("Students only");
    const eid=String(+b.event_id),er=doc(db,"events",eid),rid=eid+"_"+ME.uid,rr=doc(db,"registrations",rid);
    // The rules refuse to read a registration that does not exist yet, so check with a query (your own registrations only)
    const mine=await getDocs(query(collection(db,"registrations"),where("uid","==",ME.uid)));
    const had=mine.docs.some(d=>d.id===rid);
    await runTransaction(db,async tx=>{
      const es=await tx.get(er);
      if(!es.exists()||es.data().status!="Active")fail("This event is not open for registration.");
      const e=es.data();
      if(e.endAt&&e.endAt.toMillis()<Date.now())fail("This event has already ended.");
      let prev=null;
      if(had){const rs=await tx.get(rr);prev=rs.exists()?rs.data():null}
      if(prev&&prev.status!="Cancelled")fail("You are already registered for this event.");
      if((e.taken||0)>=e.slots)fail("This event has no open slots.");
      tx.update(er,{taken:(e.taken||0)+1});
      const contact=b.contact||ME.contact||"";
      if(prev)tx.update(rr,{status:"Registered",contact});
      else tx.set(rr,{eid,uid:ME.uid,sid:ME.id,name:ME.name,email:ME.email,contact,status:"Registered",createdAt:serverTimestamp()});
    });
    if(b.contact&&b.contact!==ME.contact){try{await updateDoc(doc(db,"accounts",ME.uid),{contact:b.contact});ME.contact=b.contact}catch(e){}}
    return{id:0,eid:+eid,status:"Registered"};
  }
  case "PATCH /registrations/:id":{
    need();const st=b.status;
    if(!["Registered","Pending","Cancelled"].includes(st))fail("Invalid status");
    const did=REGMAP[id];if(!did)fail("Registration not found");
    const rr=doc(db,"registrations",did);
    await runTransaction(db,async tx=>{
      const rs=await tx.get(rr);if(!rs.exists())fail("Registration not found");
      const r=rs.data();
      if(ME.role!="Admin"&&(r.uid!=ME.uid||st!="Cancelled"))fail("Not allowed");
      const er=doc(db,"events",String(r.eid)),es=await tx.get(er),e=es.exists()?es.data():null;
      let d=0;
      if(r.status=="Cancelled"&&st!="Cancelled"){if(!e||(e.taken||0)>=e.slots)fail("No open slots left for that event.");d=1}
      else if(r.status!="Cancelled"&&st=="Cancelled")d=-1;
      if(d&&e)tx.update(er,{taken:Math.max(0,(e.taken||0)+d)});
      tx.update(rr,{status:st});
    });
    return{ok:true};
  }
  case "DELETE /registrations/:id":{
    needAdmin();const did=REGMAP[id];if(!did)fail("Registration not found");
    const rr=doc(db,"registrations",did);
    await runTransaction(db,async tx=>{
      const rs=await tx.get(rr);if(!rs.exists())return;
      const r=rs.data(),er=doc(db,"events",String(r.eid)),es=await tx.get(er);
      if(r.status!="Cancelled"&&es.exists())tx.update(er,{taken:Math.max(0,(es.data().taken||0)-1)});
      tx.delete(rr);
    });
    return{ok:true};
  }
  }
  fail("Not found");
}

window.fbApi=async(p,m="GET",b)=>{
  if(!configured)throw new Error("Firebase is not set up yet. Paste your Firebase settings into index.html (see SETUP.md).");
  try{return await route(p,m,b||{})}catch(e){throw new Error(msg(e))}
};
window.fbSignOut=()=>{ME=null;return configured?signOut(auth).catch(()=>{}):0};
window.__fbResolve();
</script>
